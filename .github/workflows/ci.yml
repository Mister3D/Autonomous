name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # Required on `main` (GitHub ruleset): only accept PRs whose head is `dev`.
  main-from-dev:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require head branch to be dev
        run: |
          head="${{ github.head_ref }}"
          echo "PR base=main head=${head}"
          if [ "$head" != "dev" ]; then
            echo "::error::PRs into main must come from the dev branch (got '${head}'). Merge into dev first."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Pytest
        run: pytest tests -q --tb=short
        env:
          AUTONOMOUS_HOME: ${{ runner.temp }}/autonomous-home

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
